name: NOMAD v0.18 platform engineering checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Initialize installed Rust toolchain
        timeout-minutes: 2
        shell: python {0}
        run: |
          import os, pathlib, subprocess, tempfile, time
          started = time.monotonic()
          subprocess.run(['rustc', '--version'], check=True, timeout=30)
          with tempfile.TemporaryDirectory(prefix='nomad-rust-setup-') as directory:
              root = pathlib.Path(directory)
              source = root / 'setup.rs'
              binary = root / ('setup.exe' if os.name == 'nt' else 'setup')
              source.write_text('fn main() { println!("NOMAD toolchain ready"); }', encoding='utf-8')
              subprocess.run(['rustc', '--edition=2021', '-O', str(source), '-o', str(binary)],
                             check=True, timeout=60)
              subprocess.run([str(binary)], check=True, timeout=7)
          print(f'Rust toolchain setup wall seconds: {time.monotonic() - started:.6f}')
      - name: Check sealed source bytes
        run: python -B scripts/verify_package_v18.py
      - name: Run inherited and platform engineering tests
        run: python -B -m unittest discover -s tests -v
      - name: Run trusted research mission
        run: python -B -m nomad.platform_cli trusted-demo
      - name: Report environment without granting containment authority
        run: python -B -m nomad.platform_cli doctor
