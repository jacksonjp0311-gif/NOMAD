name: NOMAD v0.17 protection verification
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install only test-time dependencies for the known trusted corpus
        run: python -m pip install pytest
      - name: Verify frozen package then inherited and mission tests
        run: python -B scripts/verify_package_v17.py --tests --security --smoke
      - name: Native Python and JavaScript adapter smoke tests
        run: |
          python -B -m nomad.transcend_cli --demo --language python
          python -B -m nomad.transcend_cli --demo --language javascript
  windows-manual:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify research fixture mission ownership and recovery on Windows
        run: python -B scripts/verify_package_v17.py --security --smoke
