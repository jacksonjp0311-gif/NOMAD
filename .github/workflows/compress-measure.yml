name: compress-measure

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run compression measurement
        run: python -m nomad.compress_measure
      - name: Commit result
        run: |
          git config user.name "nomad"
          git config user.email "nomad@users.noreply.github.com"
          git add data/compress_measure.json || true
          git diff --staged --quiet || git commit -m "compression measurement"
          git pull --rebase origin main || true
          git push || true
