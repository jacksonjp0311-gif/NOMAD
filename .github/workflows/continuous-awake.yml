name: continuous-awake
# Pair both arms in one job so the scoreboard records a real certified delta.
# Control runs first (cold prior). Treatment uses the field and only enqueues
# versioned packets; sleep is the single learner. Concurrent data writers
# share one group.
# Fallback runtime: no-ops while a nomad-body lease is fresh (data/lease.json).
# Heartbeat: a successful awake dispatches continuous-sleep (scripts/heartbeat.sh).
# Crons stay as a fallback restart; nomad-watch re-dispatches if the chain dies.
on:
  schedule:
    - cron: "8 * * * *"
    - cron: "23 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [awake]
permissions:
  contents: write
  actions: write
concurrency:
  group: nomad-continuous-data
  cancel-in-progress: false
jobs:
  pair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Body lease
        id: lease
        run: python -m nomad.body lease
      - name: Run paired awake
        if: ${{ steps.lease.outputs.alive != 'true' }}
        run: python -m nomad.continuous pair
      - name: Organism status
        if: ${{ steps.lease.outputs.alive != 'true' }}
        run: python -m nomad.organism status > /dev/null
      - name: Commit data
        if: ${{ steps.lease.outputs.alive != 'true' }}
        run: |
          set -euo pipefail
          git config user.name "nomad"
          git config user.email "nomad@users.noreply.github.com"
          git add data/ || true
          if git diff --staged --quiet; then
            echo "no data changes"
            exit 0
          fi
          git commit -m "continuous awake"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((i * 2))
          done
          echo "rebase-retry exhausted" >&2
          exit 1
      - name: Heartbeat -> sleep
        if: ${{ success() && steps.lease.outputs.alive != 'true' && vars.NOMAD_HEARTBEAT != 'off' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/heartbeat.sh chain continuous-sleep.yml 0
