name: continuous-awake
# schedule re-registered 2026-11-20 with second trigger
on:
  schedule:
    - cron: "7 * * * *"
    - cron: "22 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  treatment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run awake
        run: python -m nomad.continuous awake --arm treatment
      - name: Commit data
        run: |
          git config user.name "nomad"
          git config user.email "nomad@users.noreply.github.com"
          git add data/ || true
          git diff --staged --quiet || git commit -m "continuous awake"
          git pull --rebase origin main
          git push
  control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run awake (control)
        run: python -m nomad.continuous awake --arm control
