name: continuous-awake
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
jobs:
  treatment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m nomad.continuous awake --arm treatment
      - run: |
          git config user.name "nomad"
          git config user.email "nomad@users.noreply.github.com"
          git add data/continuous/
          git diff --staged --quiet || git commit -m "continuous awake"
          git push
  control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m nomad.continuous awake --arm control
