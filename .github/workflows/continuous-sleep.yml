name: continuous-sleep
# Treatment consolidates. Control is frozen and has nothing to persist.
# Shares the data concurrency group with awake so commits cannot race.
# re-registered 2026-11-20 shifted minutes
on:
  schedule:
    - cron: "38 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [sleep]
permissions:
  contents: write
concurrency:
  group: nomad-continuous-data
  cancel-in-progress: false
jobs:
  treatment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run sleep
        run: python -m nomad.continuous sleep --arm treatment
      - name: Commit data
        run: |
          set -euo pipefail
          git config user.name "nomad"
          git config user.email "nomad@users.noreply.github.com"
          git add data/ || true
          if git diff --staged --quiet; then
            echo "no data changes"
            exit 0
          fi
          git commit -m "continuous sleep"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((i * 2))
          done
          echo "rebase-retry exhausted" >&2
          exit 1

  control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run sleep (control)
        run: python -m nomad.continuous sleep --arm control
