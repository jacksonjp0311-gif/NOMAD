name: continuous-sleep
# schedule re-registered 2026-11-19
on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  treatment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run sleep
        run: python -m nomad.continuous sleep --arm treatment
      - name: Commit data
        run: |
          git config user.name "nomad"
          git config user.email "nomad@users.noreply.github.com"
          git add data/ || true
          git diff --staged --quiet || git commit -m "continuous sleep"
          git pull --rebase origin main
          git push
  control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run sleep (control)
        run: python -m nomad.continuous sleep --arm control
