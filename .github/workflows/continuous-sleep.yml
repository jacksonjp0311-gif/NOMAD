name: continuous-sleep
on:
  schedule:
    - cron: "30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  treatment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run minimal cycle
        run: python -m nomad.cycle sleep
      - name: Commit data
        run: |
          git config user.name "nomad"
          git config user.email "nomad@users.noreply.github.com"
          git add data/ || true
          git diff --staged --quiet || git commit -m "continuous sleep"
          git push
