name: continuous-sleep
# Fallback runtime: no-ops while a nomad-body lease is fresh. Treatment
# consolidates (single learner), then the evolve organ guards the last genome
# change (git revert on live regression) and maybe tries one gene. Control is frozen.
# Shares the data concurrency group with awake so commits cannot race.
# Heartbeat: a successful sleep dispatches the next continuous-awake, not
# before NOMAD_CHAIN_GAP_MIN minutes (default 15) after the last awake began.
on:
  schedule:
    - cron: "38 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [sleep]
permissions:
  contents: write
  actions: write
concurrency:
  group: nomad-continuous-data
  cancel-in-progress: false
jobs:
  treatment:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Body lease
        id: lease
        run: python -m nomad.body lease
      - name: Run sleep
        if: ${{ steps.lease.outputs.alive != 'true' }}
        run: python -m nomad.continuous sleep --arm treatment
      - name: Organism status
        if: ${{ steps.lease.outputs.alive != 'true' }}
        run: python -m nomad.organism status > /dev/null
      - name: Commit data
        if: ${{ steps.lease.outputs.alive != 'true' }}
        run: |
          set -euo pipefail
          git config user.name "nomad"
          git config user.email "nomad@users.noreply.github.com"
          git add data/ || true
          if git diff --staged --quiet; then
            echo "no data changes"
            exit 0
          fi
          git commit -m "continuous sleep"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((i * 2))
          done
          echo "rebase-retry exhausted" >&2
          exit 1
      - name: Evolve organ (guard + maybe one gene)
        if: ${{ success() && steps.lease.outputs.alive != 'true' && vars.NOMAD_EVOLVE != 'off' }}
        run: python -m nomad.body evolve-step --push
    outputs:
      alive: ${{ steps.lease.outputs.alive }}

  control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run sleep (control)
        run: python -m nomad.continuous sleep --arm control

  heartbeat:
    needs: treatment
    if: ${{ success() && needs.treatment.outputs.alive != 'true' && vars.NOMAD_HEARTBEAT != 'off' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Heartbeat -> awake
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/heartbeat.sh chain continuous-awake.yml "${{ vars.NOMAD_CHAIN_GAP_MIN || '15' }}"
