name: measure-abstract
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run abstract targets
        run: |
          python -c "
          from nomad.abstract_targets import attempt_all
          import json
          results = attempt_all()
          print(json.dumps(results, indent=2))
          open('data/abstract_measure.json', 'w').write(json.dumps(results, indent=2))
          "
      - name: Commit result
        run: |
          git config user.name "nomad"
          git config user.email "nomad@users.noreply.github.com"
          git add data/abstract_measure.json || true
          git diff --staged --quiet || git commit -m "abstract targets measurement"
          git pull --rebase origin main || true
          git push || true
