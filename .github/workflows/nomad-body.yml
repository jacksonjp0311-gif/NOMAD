name: nomad-body
# Primary runtime on GitHub: one long-lived body (~5.5 h) running the whole
# organism loop in process (python -m nomad.body). GitHub is only one host;
# the same command runs on a desktop or any CPU host. A single-body lease in
# data/lease.json keeps two hosts from writing. At the START of each run the body
# queues its successor (and again at exit if none is pending); the nomad-body concurrency group keeps exactly
# one body running (the successor waits as pending). Short awake/sleep
# workflows are fallbacks and no-op while the lease is fresh. nomad-watch
# restarts the body if its heartbeat is older than 30 minutes.
on:
  workflow_dispatch:
    inputs:
      hours:
        description: "Body lifetime in hours"
        default: "5.5"
permissions:
  contents: write
  actions: write
concurrency:
  group: nomad-body
  cancel-in-progress: false
jobs:
  body:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lease gate (stand by, or take over a released/stale/orphaned lease)
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The holder's GitHub run status lets a body take over a fresh-looking
          # lease left by a cancelled/crashed run (lease.orphaned); otherwise it
          # would stand by until the 30-minute stale window.
          rid=$(python -c "from nomad import lease; print(lease.gh_run_id(lease.read()) or '')")
          status=""
          if [ -n "$rid" ] && [ "$rid" != "$GITHUB_RUN_ID" ]; then
            status=$(gh run view "$rid" -R "$GITHUB_REPOSITORY" --json status -q .status 2>/dev/null || echo unknown)
          fi
          echo "holder_status=$status" >> "$GITHUB_OUTPUT"
          python -m nomad.body gate --holder-status "$status"
      - name: Queue successor first (so a crash or cancel cannot break the chain)
        # Only a body that will hold the lease queues a successor. A standby run
        # queues nothing, so standby runs cannot chain (Nov 21 2026 restart storm).
        if: ${{ vars.NOMAD_BODY != 'off' && steps.gate.outputs.standby == 'no' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pending=$(gh run list -R "$GITHUB_REPOSITORY" -w nomad-body.yml -s queued -L 5 --json databaseId -q length)
          pending=$((pending + $(gh run list -R "$GITHUB_REPOSITORY" -w nomad-body.yml -s pending -L 5 --json databaseId -q length)))
          if [ "$pending" -gt 0 ]; then echo "successor already pending"; exit 0; fi
          gh workflow run nomad-body.yml -R "$GITHUB_REPOSITORY" --ref main
          echo "successor queued at start"
      - name: Live
        id: body
        env:
          # Bridge training families (string x int) in the live curriculum; repo variable
          # NOMAD_LIVE_BRIDGE=off turns it off (code default is off everywhere else).
          NOMAD_LIVE_BRIDGE: ${{ vars.NOMAD_LIVE_BRIDGE || 'on' }}
        run: |
          git config user.name "nomad"
          git config user.email "nomad@users.noreply.github.com"
          python -m nomad.body --hours "${{ inputs.hours || '5.5' }}" --push \
            --cycle-gap-s "${{ vars.NOMAD_CYCLE_GAP_S || '15' }}" \
            --checkpoint-min "${{ vars.NOMAD_CHECKPOINT_MIN || '10' }}" \
            --holder-status "${{ steps.gate.outputs.holder_status }}"
      - name: Dispatch successor
        if: ${{ always() && steps.body.outputs.successor == 'yes' && vars.NOMAD_BODY != 'off' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pending=$(gh run list -R "$GITHUB_REPOSITORY" -w nomad-body.yml -s queued -L 5 --json databaseId -q length)
          pending=$((pending + $(gh run list -R "$GITHUB_REPOSITORY" -w nomad-body.yml -s pending -L 5 --json databaseId -q length)))
          if [ "$pending" -gt 0 ]; then echo "successor already pending"; exit 0; fi
          gh workflow run nomad-body.yml -R "$GITHUB_REPOSITORY" --ref main
          echo "successor dispatched"
