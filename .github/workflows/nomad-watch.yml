name: nomad-watch
# Watchdog. Runs after every awake/sleep/body completion and on a fallback
# cron. If the body's lease heartbeat (data/lease.json) is older than 30
# minutes and no body run is queued or running, it re-dispatches nomad-body
# and logs the gap to data/organism_events.jsonl. The awake/sleep chain and
# crons remain as a second fallback. Deliberately NOT in the data concurrency group,
# so it can never cancel a pending awake/sleep.
on:
  workflow_run:
    workflows: [continuous-awake, continuous-sleep, nomad-body]
    types: [completed]
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: nomad-watch
  cancel-in-progress: true
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check heartbeat
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/heartbeat.sh watch "${{ vars.NOMAD_STALE_MIN || '30' }}"
      - name: Log gap to organism health
        if: ${{ env.GAP_MINUTES != '' }}
        run: |
          set -euo pipefail
          python -m nomad.organism event heartbeat_gap --minutes "$GAP_MINUTES" --action redispatched_body > /dev/null
          git config user.name "nomad"
          git config user.email "nomad@users.noreply.github.com"
          git add data/organism_events.jsonl
          git checkout -- data/organism.json 2>/dev/null || true
          git commit -m "nomad-watch: heartbeat gap ${GAP_MINUTES} min" || exit 0
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then exit 0; fi
            git rebase --abort || true
            sleep $((i * 3))
          done
