name: sealed-prefer

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run sealed prefer measurement
        run: python -m nomad.sealed_prefer
      - name: Commit result
        run: |
          git config user.name "nomad"
          git config user.email "nomad@users.noreply.github.com"
          git add data/sealed_prefer.json || true
          git diff --staged --quiet || git commit -m "sealed prefer measurement"
          git pull --rebase origin main || true
          git push || true
